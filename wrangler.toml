name = "tgbot-d1"
main = "src/index.js"
compatibility_date = "2026-07-01"

[vars]
ADMIN_IDS = "7178051047"
ADMIN_GROUP_ID = "-1003941218222"
APP_BASE_URL = "https://killer.tsm.cc.cd"
BOT_USERNAME = "Childkiller_bot"
MONITOR_GROUP_IDS = ""

# 以下为机密变量（已通过 wrangler secret 配置，勿写在此文件中）：
#   BOT_TOKEN             — Telegram Bot Token
#   TURNSTILE_SECRET_KEY  — Cloudflare Turnstile 密钥
#   TURNSTILE_SITE_KEY    — Turnstile 站点密钥
#   WEBHOOK_SECRET        — Webhook 密钥

# D1 数据库绑定，变量名必须严格为 TG_BOT_DB（代码读取 env.TG_BOT_DB）
[[d1_databases]]
binding = "TG_BOT_DB"
database_name = "tg-bot-db"
database_id = "085cca99-96f9-4871-a67f-58a5c20e2964"
